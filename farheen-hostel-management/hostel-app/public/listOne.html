<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Resident</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner">
<a class="brand" href="index.html">Farheen Hostel Management</a>
<nav><a href="index.html">Home</a><a href="list.html">Residents</a><a href="rooms.html">Rooms</a><a href="listOne.html" class="active">Find Resident</a><a href="insert.html">Insert Resident</a><a href="update.html">Update Resident</a><a href="delete.html">Check-out</a></nav>
</div></header>
<main class="page">
<div class="page-head">
<div>
<h1>Find resident</h1>
<p>Choose a resident from the list to see their record and roommates.</p>
</div>
<img src="images/search.svg" alt="">
</div>
<div class="card">
<div id="msg" class="msg"></div>
<div class="field"><label for="sno">Resident</label>
<select id="sno" onchange="find()"></select></div>
<div class="table-wrap"><table id="tbl">
<thead><tr><th>Resident ID</th><th>Name</th><th>Phone</th><th>Room</th><th>Fee Paid</th><th>Balance</th><th>Status</th></tr></thead>
<tbody><tr><td colspan="7" class="empty">Select a resident to view details.</td></tr></tbody></table></div>
<p class="hint" id="mates"></p>
<div class="actions" style="margin-top:18px"><button class="secondary" onclick="location.href='index.html'">Home page</button></div>
</div>
</main>
<footer>Farheen Hostel Management System</footer>
<script src="hostel.js"></script>
<script>
let all = [], fee = 0;
Promise.all([api.config(), api.residents()]).then(([c, r]) => { fee = c.fee; all = r; fillResidents(document.getElementById("sno"), r); })
  .catch(() => showMsg("Could not load residents.", "err"));

function find(){
  const id = document.getElementById("sno").value, body = document.querySelector("#tbl tbody");
  document.getElementById("msg").className = "msg"; document.getElementById("mates").textContent = "";
  if (!id){ body.innerHTML = '<tr><td colspan="7" class="empty">Select a resident to view details.</td></tr>'; return; }
  fetch("/residents/" + encodeURIComponent(id)).then(r => r.json()).then(d => {
    if (!d.length){ showMsg("Resident not found", "err"); return; }
    const s = d[0];
    body.innerHTML = `<tr><td>${esc(s.resident_id)}</td><td>${esc(s.resident_name)}</td><td>${esc(s.phone)}</td><td>${esc(s.room_no)}</td>
      <td>${money(s.fee_paid)}</td><td>${money(fee - s.fee_paid)}</td><td>${feeBadge(s.fee_paid, fee)}</td></tr>`;
    const m = all.filter(x => x.room_no === s.room_no && x.resident_id !== s.resident_id).map(x => x.resident_name);
    document.getElementById("mates").textContent = "Roommates: " + (m.length ? m.join(", ") : "none");
  }).catch(() => showMsg("Could not load the resident.", "err"));
}
</script>
</body>
</html>
